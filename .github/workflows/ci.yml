name: Django CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
        - "3.12"
        toxenv:
        - "django52"
        - "translations"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: uv sync --locked --group ci

    - name: Run Tests
      env:
        TOXENV: ${{ matrix.toxenv }}
      run: uv run --locked tox

  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toxenv:
        - "quality"
        - "pii_check"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true
        python-version: '3.12'

    - name: Install Dependencies
      run: uv sync --locked --group ci

    - name: Run Checks
      env:
        TOXENV: ${{ matrix.toxenv }}
      run: uv run --locked tox
